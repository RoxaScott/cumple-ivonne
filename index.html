<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>🎉 Feliz Cumpleaños Ivonne Anais 🎂</title>
  <style>
    body {
      margin: 0;
      font-family: "Comic Sans MS", cursive;
      background: url("https://wallpapers.com/images/hd/one-piece-straw-hat-crew-celebration-3f3f7b.jpg") no-repeat center center/cover;
      text-align: center;
      color: #fff;
      overflow-x: hidden;
    }
    h1 {
      margin-top: 30px;
      font-size: 3em;
      text-shadow: 3px 3px 6px #000;
    }
    .logo {
      margin: 20px auto;
      width: 250px;
    }
    .cake {
      margin: 30px auto;
      width: 200px;
      cursor: pointer;
      transition: transform 0.3s;
      z-index: 10;
      position: relative;
    }
    .cake:hover {
      transform: scale(1.1);
    }
    .btn {
      display: inline-block;
      margin: 15px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #ffcc00;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn:hover {
      background: #ffaa00;
    }
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* 🎭 Personajes flotantes */
    .character {
      position: absolute;
      width: 120px;
      animation: float 6s ease-in-out infinite;
      z-index: 5;
    }
    .luffy { top: 20%; left: 5%; animation-delay: 0s; }
    .zoro { top: 50%; left: 80%; animation-delay: 2s; }
    .nami { top: 70%; left: 10%; animation-delay: 4s; }
    .chopper { top: 25%; left: 70%; animation-delay: 6s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-30px) rotate(5deg); }
    }
  </style>
</head>
<body>
  <!-- Logo -->
  <img src="https://upload.wikimedia.org/wikipedia/commons/2/29/One_Piece_Logo.svg" alt="One Piece" class="logo">
  
  <!-- Título -->
  <h1>🎉 ¡Feliz Cumpleaños Ivonne Anais! 🎉</h1>

  <p>Haz clic en el pastel para lanzar confeti 🎂✨</p>
  <img src="https://i.imgur.com/jI1kB6S.png" alt="Pastel" class="cake" id="cake">

  <!-- Botón para reproducir las mañanitas -->
  <div>
    <button class="btn" onclick="playSong()">🎶 Reproducir Las Mañanitas</button>
  </div>

  <!-- Personajes flotando -->
  <img src="https://i.imgur.com/zK1suG7.png" alt="Luffy" class="character luffy">
  <img src="https://i.imgur.com/Fur7Qki.png" alt="Zoro" class="character zoro">
  <img src="https://i.imgur.com/ZWGJj3M.png" alt="Nami" class="character nami">
  <img src="https://i.imgur.com/csUnf5d.png" alt="Chopper" class="character chopper">

  <!-- YouTube embed invisible -->
  <div id="player"></div>

  <!-- Canvas para confeti -->
  <canvas id="confetti"></canvas>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // YouTube API
    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '0',
        width: '0',
        videoId: 'gkTb9GP9lVI', // Las Mañanitas
        playerVars: { 'autoplay': 0 }
      });
    }
    function playSong() {
      if (player) player.playVideo();
    }

    // Confeti
    const cake = document.getElementById("cake");
    const confetti = document.getElementById("confetti");
    const ctx = confetti.getContext("2d");
    confetti.width = window.innerWidth;
    confetti.height = window.innerHeight;

    let pieces = [];
    for (let i = 0; i < 200; i++) {
      pieces.push({
        x: Math.random() * confetti.width,
        y: Math.random() * confetti.height - confetti.height,
        w: 10,
        h: 10,
        color: `hsl(${Math.random()*360},100%,50%)`,
        speed: Math.random() * 5 + 2
      });
    }

    function draw() {
      ctx.clearRect(0,0,confetti.width,confetti.height);
      for (let p of pieces) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x,p.y,p.w,p.h);
        p.y += p.speed;
        if (p.y > confetti.height) p.y = -10;
      }
      requestAnimationFrame(draw);
    }
    draw();

    // Evento para lanzar confeti
    cake.addEventListener("click", () => {
      for (let p of pieces) {
        p.y = Math.random() * -confetti.height;
      }
    });
  </script>
</body>
</html>
